<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>90-Day Backend Roadmap</title>
<meta name="description" content="12-week execution tracker: 2 YOE to 15+ LPA Backend / Full-Stack Engineer.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fb; --surface:#ffffff; --surface-2:#f2f3f9; --border:#e4e6f0; --border-strong:#c9cce0;
  --text:#14151f; --muted:#666a80; --accent:#5b5bf0; --accent-soft:#ececfe;
  --ok:#16a34a; --warn:#b45309; --warn-soft:#fff6e5; --danger:#dc2626;
  --pg:#3b82f6; --dist:#f97316; --hld:#8b5cf6; --dsa:#0d9488; --lld:#ca8a04; --proj:#6366f1; --career:#db2777; --speak:#65a30d;
  --ph1:#6366f1; --ph2:#f59e0b; --ph3:#10b981;
  --ring-bg:#eceef6; --hl:91,91,240; --h0:#eceef5;
  --shadow:0 1px 2px rgba(20,21,40,.04),0 10px 30px -14px rgba(20,21,40,.14);
  --grad:linear-gradient(135deg,#4338ca 0%,#7c3aed 55%,#0e7490 100%);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0c14; --surface:#13141f; --surface-2:#1b1d2b; --border:#262839; --border-strong:#3a3d55;
    --text:#ecedf5; --muted:#9a9db2; --accent:#8b8dff; --accent-soft:#1f2040;
    --ok:#4ade80; --warn:#fbbf24; --warn-soft:#2a2112; --danger:#f87171;
    --pg:#60a5fa; --dist:#fb923c; --hld:#a78bfa; --dsa:#2dd4bf; --lld:#facc15; --proj:#818cf8; --career:#f472b6; --speak:#a3e635;
    --ph1:#818cf8; --ph2:#fbbf24; --ph3:#34d399;
    --ring-bg:#23253a; --hl:139,141,255; --h0:#1d1f2e;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset;
    --grad:linear-gradient(135deg,#3730a3 0%,#6d28d9 55%,#155e75 100%);
  }
}
:root[data-theme="dark"]{
  --bg:#0b0c14; --surface:#13141f; --surface-2:#1b1d2b; --border:#262839; --border-strong:#3a3d55;
  --text:#ecedf5; --muted:#9a9db2; --accent:#8b8dff; --accent-soft:#1f2040;
  --ok:#4ade80; --warn:#fbbf24; --warn-soft:#2a2112; --danger:#f87171;
  --pg:#60a5fa; --dist:#fb923c; --hld:#a78bfa; --dsa:#2dd4bf; --lld:#facc15; --proj:#818cf8; --career:#f472b6; --speak:#a3e635;
  --ph1:#818cf8; --ph2:#fbbf24; --ph3:#34d399;
  --ring-bg:#23253a; --hl:139,141,255; --h0:#1d1f2e;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset;
  --grad:linear-gradient(135deg,#3730a3 0%,#6d28d9 55%,#155e75 100%);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.15;margin:0}
h2{font-size:22px;margin:0 0 12px}
h3{font-size:16px;margin:0}
a{color:var(--accent)}
code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12.5px;background:var(--surface-2);padding:1px 6px;border-radius:5px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;align-items:center} .gap{gap:8px} .wrap{flex-wrap:wrap} .between{justify-content:space-between}
.hidden{display:none!important}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:16px}
.inner{max-width:1180px;margin:0 auto;padding:28px 28px 90px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font:700 16px "Space Grotesk",sans-serif;flex-shrink:0}
.bt{font:700 15px "Space Grotesk",sans-serif}
.bs{font-size:12px;color:var(--muted)}
.brand .icon-btn{margin-left:auto}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);cursor:pointer;font-size:15px}
.lvl{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:12px}
.lvl-name{font-weight:600;font-size:13px}
.streak{font-weight:700;font-size:13px}
.xpbar{height:8px;border-radius:99px;background:var(--ring-bg);overflow:hidden;margin:8px 0 6px}
.xpbar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .5s}
.xpmeta{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:10px;cursor:pointer;font:500 14px Inter,sans-serif;text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .ic{width:22px;text-align:center}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;font:inherit;padding:0;text-decoration:underline}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:30;height:auto;padding:10px 16px 8px;gap:8px;border-right:0;border-bottom:1px solid var(--border)}
  .side .lvl,.side-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
  .nav::-webkit-scrollbar{display:none}
  .nav button{white-space:nowrap;padding:7px 10px;font-size:13px}
  .inner{padding:16px 16px 80px}
  h1{font-size:24px}
}
.mob-stat{display:none;font-size:12px;font-weight:600;gap:10px;margin-left:auto}
@media (max-width:900px){.mob-stat{display:flex}.brand .icon-btn{margin-left:8px}}

/* ---------- Buttons & inputs ---------- */
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:10px;cursor:pointer;font:600 13px Inter,sans-serif;transition:transform .1s,border-color .15s}
.btn:hover{border-color:var(--accent)} .btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.light{background:#fff;color:#3730a3;border-color:#fff}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--danger)}
.f{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px 11px;font:14px Inter,sans-serif;min-width:0}
.f:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea.f{width:100%;min-height:90px;resize:vertical;line-height:1.5}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;cursor:pointer;user-select:none}
.toggle input{position:absolute;opacity:0}
.toggle span{width:34px;height:20px;border-radius:99px;background:var(--border-strong);position:relative;transition:background .2s}
.toggle span::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle input:checked + span{background:var(--accent)}
.toggle input:checked + span::after{transform:translateX(14px)}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid.three{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid > .card{margin-bottom:0}
.grid{margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));white-space:nowrap}
.chip.ghost{background:var(--surface-2);color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.empty{color:var(--muted);font-size:13px;padding:8px 10px;background:var(--surface-2);border-radius:10px}
.note{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);color:var(--text);padding:12px 14px;border-radius:12px;margin-bottom:16px;font-size:14px}
.ticks{list-style:none;margin:0;padding:0}
.ticks li{padding:6px 0 6px 26px;position:relative}
.ticks li::before{content:"→";position:absolute;left:4px;color:var(--accent);font-weight:700}

/* ---------- Ring ---------- */
.ringbox{position:relative;display:inline-grid;place-items:center;flex-shrink:0}
.ringbox svg circle.fg{transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.ringbox .rl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ringbox .rl b{font:700 1em "Space Grotesk",sans-serif}
.ringbox .rl span{font-size:11px;opacity:.8}

/* ---------- Items ---------- */
.items{display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:10px;transition:background .15s}
.item:hover{background:var(--surface-2)}
.chk{display:flex;gap:12px;align-items:flex-start;flex:1;cursor:pointer;min-width:0;position:relative}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.box{width:20px;height:20px;border-radius:7px;border:2px solid var(--border-strong);flex-shrink:0;margin-top:1px;display:grid;place-items:center;transition:background .15s,border-color .15s,transform .15s}
.chk:hover .box{border-color:var(--c,var(--accent))}
.box svg{width:13px;height:13px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .25s .05s}
.chk input:checked + .box{background:var(--c,var(--ok));border-color:var(--c,var(--ok));transform:scale(1.05)}
.chk input:checked + .box svg{stroke-dashoffset:0}
.chk input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.txt{min-width:0}
.txt .t{font-weight:500}
.txt .d{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.item.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.meta{display:flex;gap:6px;align-items:center;flex-shrink:0;padding-top:1px}
.lc{font-size:12px;font-weight:600;text-decoration:none;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--text);border:1px solid var(--border);white-space:nowrap}
.lc:hover{border-color:var(--dsa);color:var(--dsa)}
.hide-done .item.done{display:none}

/* ---------- Hero ---------- */
.hero{background:var(--grad);color:#fff;border-radius:22px;padding:28px;display:flex;gap:24px;align-items:center;justify-content:space-between;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.hero h1{font-size:40px;margin:6px 0}
.hero h1 span{opacity:.6;font-size:.6em}
.hero p{margin:0 0 16px;opacity:.9}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.hero-stats div{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:8px 14px;min-width:96px}
.hero-stats b{display:block;font:700 20px "Space Grotesk",sans-serif}
.hero-stats span{font-size:12px;opacity:.85}
.hero .btn.light{margin-top:10px}
.hero-r{position:relative;z-index:1}
.hero .ringbox .rl b{font-size:30px}
@media (max-width:700px){.hero{flex-direction:column;align-items:flex-start;padding:22px}.hero h1{font-size:30px}.hero-r{align-self:center}}

/* ---------- Journey ---------- */
.journey{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;position:relative}
.jnode{border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:12px;color:var(--text);font:inherit}
.jnode:hover{background:var(--surface-2)}
.jnode.now{background:var(--accent-soft)}
.jnode .jl{font-size:11px;color:var(--muted)}
.jnode.full .ringbox .rl b::after{content:" ✓"}
.phase-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.phase-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
@media (max-width:700px){.journey{grid-template-columns:repeat(6,1fr)}}

/* ---------- Mission ---------- */
.blocks{display:flex;flex-direction:column;gap:10px}
.mblock{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;border:1px solid var(--border);border-left:4px solid var(--c);border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--c) 4%,var(--surface))}
.mtime b{display:block;font:700 15px "JetBrains Mono",monospace}
.mtime span{font-size:12px;font-weight:600;color:var(--c)}
.mbody .item{padding:5px 6px}
.prompt-mini .t{font-weight:600;margin:6px 0 2px}
.prompt-mini .d{font-size:13px;color:var(--muted);margin-bottom:8px}
@media (max-width:600px){.mblock{grid-template-columns:1fr;gap:4px}.mtime{display:flex;gap:8px;align-items:baseline}}

/* ---------- Heatmap ---------- */
.heat{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.hcol{display:flex;flex-direction:column;gap:4px}
.heat i,.heat-leg i{display:block;width:16px;height:16px;border-radius:4px;background:var(--h0)}
.h1{background:rgba(var(--hl),.3)!important}.h2{background:rgba(var(--hl),.55)!important}.h3{background:rgba(var(--hl),.8)!important}.h4{background:rgb(var(--hl))!important}
.heat i.fut{opacity:.35}
.heat i.today{outline:2px solid var(--text);outline-offset:1px}
.heat-leg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:10px}
.heat-leg i{width:12px;height:12px}

/* ---------- Topic rings / badges ---------- */
.track-rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.tring{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text);font:600 12px Inter,sans-serif;text-align:center;transition:transform .15s,border-color .15s}
.tring:hover{transform:translateY(-2px);border-color:var(--border-strong)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px dashed var(--border-strong);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;opacity:.5;filter:grayscale(1)}
.badge .bi{font-size:26px}
.badge b{font-size:13px}
.badge span:last-child{font-size:12px;color:var(--muted)}
.badge.on{opacity:1;filter:none;border-style:solid;border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}

/* ---------- Week view ---------- */
.weekchips{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin-bottom:16px}
.wchip{border:1px solid var(--border);border-radius:10px;padding:8px 0;cursor:pointer;font:700 13px "Space Grotesk",sans-serif;color:var(--text);position:relative;overflow:hidden;background:var(--surface)}
.wchip::before{content:"";position:absolute;left:0;bottom:0;height:4px;width:var(--p);background:var(--phc)}
.wchip.ph1{--phc:var(--ph1)}.wchip.ph2{--phc:var(--ph2)}.wchip.ph3{--phc:var(--ph3)}
.wchip.sel{background:var(--phc);color:#fff;border-color:var(--phc)}
.wchip.sel::before{background:rgba(255,255,255,.6)}
.wchip.now::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--danger)}
@media (max-width:700px){.weekchips{grid-template-columns:repeat(6,1fr)}}
.week-hero{display:flex;gap:20px;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.week-hero::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--phc,var(--c))}
.week-hero.ph1{--phc:var(--ph1)}.week-hero.ph2{--phc:var(--ph2)}.week-hero.ph3{--phc:var(--ph3)}
.week-hero .eyebrow{color:var(--phc,var(--c));opacity:1}
.week-hero h1{margin:6px 0 12px}
.nowtag{background:var(--danger);color:#fff;padding:1px 7px;border-radius:99px;font-size:10px}
@media (max-width:700px){.week-hero{flex-direction:column;align-items:flex-start}.week-hero .wh-r{align-self:center}}
.track-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:16px}
@media (max-width:420px){.track-grid{grid-template-columns:1fr}}
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 12px 10px;box-shadow:var(--shadow);border-top:4px solid var(--c)}
.tcard-h{display:flex;align-items:center;gap:8px;padding:0 6px}
.tcard-h h3{flex:1}
.tdot{width:10px;height:10px;border-radius:3px;background:var(--c)}
.tcount{font:700 13px "JetBrains Mono",monospace;color:var(--c)}
.tbar{height:5px;border-radius:99px;background:var(--ring-bg);margin:10px 6px 8px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .5s}

/* ---------- Topic view ---------- */
.topicchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:99px;padding:7px 14px;cursor:pointer;font:600 13px Inter,sans-serif}
.tchip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tchip span{color:var(--muted);font-weight:500}
.tchip.sel{background:var(--c);border-color:var(--c);color:#fff}
.tchip.sel i{background:#fff}.tchip.sel span{color:rgba(255,255,255,.85)}
.tl{position:relative;padding-left:8px}
.tl-row{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;position:relative;padding-bottom:16px}
.tl-row::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--border)}
.tl-row:last-child::before{display:none}
.tl-dot{width:40px;height:40px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;font:700 14px "Space Grotesk",sans-serif;background:var(--surface);color:var(--c);z-index:1}
.tl-row.full .tl-dot{background:var(--c);color:#fff}
.tl-body{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 8px 8px;box-shadow:var(--shadow)}
.tl-h{display:flex;align-items:baseline;gap:10px;padding:0 6px 6px;flex-wrap:wrap}
.tl-p{margin-left:auto;font:700 13px "JetBrains Mono",monospace;color:var(--c)}

/* ---------- Speaking ---------- */
.drill{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:var(--shadow);border-top:4px solid var(--speak)}
.drill-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center}
.clock{font:700 56px "JetBrains Mono",monospace;letter-spacing:-.03em;color:var(--speak);line-height:1}
.drill-step{font:700 20px "Space Grotesk",sans-serif;margin:2px 0}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:18px}
.step{font-size:12px;display:flex;flex-direction:column;gap:3px}
.step span{color:var(--muted)}
.step .sb{height:6px;border-radius:99px;background:var(--ring-bg);overflow:hidden}
.step .sb i{display:block;height:100%;background:var(--speak);transition:width .3s}
.step.cur b{color:var(--speak)}

const STAGES = ["Target","Referral asked","Applied","Screen","Tech round","Machine coding","HLD","HR / Final","Offer","Rejected","Dropped"];
const KEY = "roadmap90.v1";
const defaultState = () => ({done:{}, start:"", prompts:{}, fillers:[], apps:[], score:{}, notes:{}, activity:{}, badges:{}, kk:{}, lec:{}, kkGoal:3, ui:{tab:"dash", hideDone:false, week:null, topic:"dsa", bt:"problems", kdiff:"all", kstat:"all", kq:"", kopen:{}}});
/* Coerce untrusted state (localStorage / imported JSON) into expected types before it reaches the DOM */
function normalize(d){
  const s = defaultState(); if(!d || typeof d !== "object") return s;
  const obj = v => (v && typeof v === "object" && !Array.isArray(v)) ? v : {};
  const num = v => { const n = Math.floor(Number(v)); return Number.isFinite(n) && n >= 0 ? n : 0; };
  const str = v => typeof v === "string" ? v : (typeof v === "number" ? String(v) : "");
  const date = v => /^d{4}-d{2}-d{2}$/.test(v) ? v : "";
  Object.entries(obj(d.done)).forEach(([k,v])=>{ s.done[k] = num(v) || Date.now(); });
  s.start = date(d.start);
  Object.entries(obj(d.prompts)).forEach(([k,v])=>{ if(/^d+$/.test(k)) s.prompts[k] = num(v); });
  Object.entries(obj(d.activity)).forEach(([k,v])=>{ if(date(k)) s.activity[k] = num(v); });
  Object.entries(obj(d.badges)).forEach(([k,v])=>{ s.badges[k] = num(v); });
  Object.entries(obj(d.notes)).forEach(([k,v])=>{ s.notes[k] = str(v); });
  Object.entries(obj(d.score)).forEach(([w,row])=>{ s.score[w] = {}; Object.entries(obj(row)).forEach(([k,v])=>{ s.score[w][k] = str(v); }); });
  s.fillers = (Array.isArray(d.fillers) ? d.fillers : []).map(x=>({id:str(x&&x.id), d:date(x&&x.d), f:String(num(x&&x.f)), r:String(num(x&&x.r)), p:String(num(x&&x.p)||1)}));
  s.apps = (Array.isArray(d.apps) ? d.apps : []).map(a=>({id:str(a&&a.id), c:str(a&&a.c), t:["A","B","C"].includes(a&&a.t)?a.t:"C", r:str(a&&a.r), ch:str(a&&a.ch), ref:str(a&&a.ref), stage:STAGES.includes(a&&a.stage)?a.stage:"Target", d:date(a&&a.d), n:str(a&&a.n)}));
  const ui = obj(d.ui);
  s.ui.tab = typeof ui.tab === "string" ? ui.tab : "dash";
  s.ui.hideDone = ui.hideDone === true;
  s.ui.week = num(ui.week) || null;
  s.ui.topic = typeof ui.topic === "string" ? ui.topic : "dsa";
  s.ui.bt = ["problems","queue","lectures","js"].includes(ui.bt) ? ui.bt : "problems";
  s.ui.kdiff = ["all","E","M","H"].includes(ui.kdiff) ? ui.kdiff : "all";
  s.ui.kstat = ["all","todo","done","review","later"].includes(ui.kstat) ? ui.kstat : "all";
  s.ui.kq = str(ui.kq).slice(0,60);
  Object.entries(obj(ui.kopen)).forEach(([k,v])=>{ if(/^[0-9a-z-]+$/.test(k)) s.ui.kopen[k] = v === true; });
  Object.entries(obj(d.kk)).forEach(([k,v])=>{ if(/^[a-z0-9-]+$/.test(k) && v && ["done","review","later"].includes(v.s)) s.kk[k] = {s:v.s, t:num(v.t)||Date.now()}; });
  Object.entries(obj(d.lec)).forEach(([k,v])=>{ if(/^\d{2}$/.test(k) && ["watching","done"].includes(v)) s.lec[k] = v; });
  s.kkGoal = Math.min(20, num(d.kkGoal)) || 3;
  return s;
}
let S = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return normalize(JSON.parse(raw));
  }catch(e){}
  return defaultState();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const todayStr = () => ymd(new Date());
function bump(){ const k = todayStr(); S.activity[k] = (S.activity[k]||0) + 1; }

/* Flatten all checkable items with stable IDs (unchanged from v1 so saved progress carries over) */
const ALL = [];
WEEKS.forEach(wk=>{
  Object.keys(TRACKS).forEach(tk=>{
    (wk[tk]||[]).forEach(raw=>{
      let it;
      if(Array.isArray(raw)) it = {title:raw[0], lc:raw[1], detail:""};
      else { const [t,d] = raw.split("|"); it = {title:t, detail:d||""}; }
      it.track = tk; it.w = wk.w; it.phase = wk.phase;
      it.id = `${tk}-w${wk.w}-${slug(it.title)}`;
      ALL.push(it);
    });
  });
});

const isDone = id => !!S.done[id];
const pct = items => items.length ? Math.round(items.filter(i=>isDone(i.id)).length / items.length * 100) : 0;
const doneN = items => items.filter(i=>isDone(i.id)).length;
const parseStart = () => S.start ? new Date(S.start+"T00:00:00") : null;
function dayNumber(){ const s = parseStart(); if(!s) return null; return Math.floor((new Date() - s) / 86400000) + 1; }
function currentWeek(){ const d = dayNumber(); if(d==null) return null; if(d < 1) return 0; return Math.min(12, Math.floor((d-1)/7) + 1); }
const dsaCount = () => doneN(ALL.filter(i=>i.track==="dsa"));
const weekDone = w => { const it = ALL.filter(i=>i.w===w); return it.length>0 && it.every(i=>isDone(i.id)); };
const phaseDone = p => ALL.filter(i=>i.phase===p).every(i=>isDone(i.id));

/* ---------- Activity & streak ---------- */
function activityMap(){
  const m = Object.assign({}, S.activity);
  Object.values(S.done).forEach(ts=>{ if(typeof ts==="number"){ const k = ymd(new Date(ts)); m[k] = (m[k]||0) + 1; } });
  Object.entries(S.kk).forEach(([slug,v])=>{ if(!RID[slug] && v.t){ const k = ymd(new Date(v.t)); m[k] = (m[k]||0) + 1; } });
  return m;
}
function streak(){
  const m = activityMap(); const d = new Date(); let n = 0;
  if(!m[ymd(d)]) d.setDate(d.getDate()-1);
  while(m[ymd(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ---------- XP & levels ---------- */
const LEVELS = [[0,"Bench Warmer"],[200,"Intern Grind"],[600,"Junior Dev"],[1200,"SDE-1"],[2000,"SDE-2"],[3000,"15 LPA Ready"]];
function xp(){
  return Object.keys(S.done).length*10 + Object.values(S.prompts).reduce((a,b)=>a+b,0)*5 + S.fillers.length*5 + S.apps.length*5 + kkXP();
}
function level(){
  const x = xp(); let i = 0;
  LEVELS.forEach((l,j)=>{ if(x >= l[0]) i = j; });
  const cur = LEVELS[i], nxt = LEVELS[i+1];
  return {i, x, name:cur[1], next:nxt?nxt[0]:null, nextName:nxt?nxt[1]:null, p: nxt ? Math.round((x-cur[0])/(nxt[0]-cur[0])*100) : 100};
}

/* ---------- Effects ---------- */
function toast(html, kind=""){
  const t = document.createElement("div"); t.className = "toast " + kind; t.innerHTML = html;
  document.getElementById("toasts").appendChild(t);
  setTimeout(()=>t.classList.add("out"), 2300); setTimeout(()=>t.remove(), 2800);
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const ctx = c.getContext("2d"); const W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ["#6366f1","#8b5cf6","#06b6d4","#22c55e","#f59e0b","#ec4899"];
  const P = Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*240, y:H*.35, vx:(Math.random()-.5)*16, vy:-Math.random()*13-4, s:5+Math.random()*5, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[Math.random()*cols.length|0]}));
  let f = 0;
  (function tick(){
    ctx.clearRect(0,0,W,H);
    P.forEach(p=>{ p.vy+=.35; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); });
    if(++f < 160) requestAnimationFrame(tick); else c.remove();
  })();
}
function beep(){
  try{ const a = new (window.AudioContext||window.webkitAudioContext)(); const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.value = .08; o.start(); o.stop(a.currentTime + .2); }catch(e){}
}

function ringBox(p, size, sw, color, inner, bg){
  const r = (size - sw) / 2, c = 2 * Math.PI * r, h = size / 2;
  return `<div class="ringbox" style="width:${size}px;height:${size}px;font-size:${Math.max(12,size/5.5)}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${bg||"var(--ring-bg)"}" stroke-width="${sw}"/><circle class="fg" cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c*(1-p/100)).toFixed(2)}" transform="rotate(-90 ${h} ${h})"/></svg><div class="rl">${inner||""}</div></div>`;
}
const lbar = (p, c) => `<div class="lbar" style="--c:${c||"var(--accent)"}"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;

    ["HashMap<K, V>","const map = new Map(); map.set(k, (map.get(k) ?? 0) + 1); map.has(k)"],

    ["swap(arr, i, j)","[arr[i], arr[j]] = [arr[j], arr[i]]"],

    ["class Node { int val; Node next; }","class ListNode { constructor(val, next = null) { this.val = val; this.next = next; } }"],

function schedule(m){
  const now = new Date(), mins = now.getHours()*60 + now.getMinutes();
  const toM = s => { const [h,mm] = s.split(":").map(Number); return h*60+mm; };
  let cur = -1; SCHEDULE.forEach((r,i)=>{ if(toM(r[0].slice(0,5)) <= mins) cur = i; });
  const BC = {A:"--speak",B:"--proj",C1:"--dsa",C2:"--pg",C3:"--dist",C4:"--lld",Gym:"--career",Commute:"--muted"};
  let html = `<section class="week-hero" style="--c:var(--accent)"><div class="wh-l"><div class="eyebrow">Daily operating system</div><h1>${now.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})} — ${cur>=0?esc(SCHEDULE[cur][2]):"Sleep. Recovery is part of the plan."}</h1><p class="muted" style="margin:0">Weekdays. Gym and sleep are fixed. Everything else bends around them.</p></div></section>`;
  html += `<div class="sched">${SCHEDULE.map((r,i)=>`<div class="srow ${i===cur?"cur":""} ${r[1]==="—"?"quiet":""}"><span class="tm">${r[0]}</span><span>${r[1]==="—"?"":`<span class="chip" style="--c:var(${BC[r[1]]||"--accent"})">${r[1]}</span>`}</span><span class="act">${esc(r[2])}</span></div>`).join("")}</div>`;
  html += `<div class="grid two" style="margin-top:16px"><section class="card"><div class="card-h"><h3>📅 Weekly rhythm</h3></div><ul class="ticks small"><li><b>Friday C3+C4:</b> 90-min timed machine-coding mock + 30-min retro</li><li><b>Saturday:</b> 4h project sprint (Block D). Afternoon off.</li><li><b>Sunday:</b> 08:00 LeetCode weekly contest (from W4) · meal prep (4 days of chicken/rice) · 60-min review + Scorecard</li></ul></section>
    <section class="card"><div class="card-h"><h3>🔁 Phase 3 reallocation (W9–12)</h3></div><ul class="ticks small"><li><b>A:</b> speaking + mock answers for this week's companies</li><li><b>B:</b> applications + referrals (daily quota)</li><li><b>C1:</b> 2 timed company-tagged mediums + 1 revisit</li><li><b>C2:</b> one HLD case out loud, 35 min</li><li><b>C3:</b> flashcards + rubber-duck explanations</li><li><b>C4:</b> redo a past machine coding, faster</li><li><b>Sat:</b> 2h full mock loop + 2h applications</li></ul></section></div>
  <div class="note">Don't push personal code from the company laptop, keep company code in personal repos, or job-hunt on company devices or network if policy forbids it. Getting fired mid-search is the worst outcome.</div>`;
  m.innerHTML = html;
}

  <section class="card"><div class="card-h"><h3>💾 Backup & sync</h3></div><p class="small muted">Progress lives in this browser's localStorage. Export weekly; import on another device to continue there.</p>
    <div class="row gap wrap"><button class="btn primary" data-act="export">Export progress (.json)</button><label class="btn">Import .json<input type="file" id="importFile" accept="application/json" class="hidden"></label><button class="btn danger" data-act="reset">Reset everything</button></div></section>
  <section class="card"><div class="card-h"><h3>🌐 Hosting on GitHub Pages</h3></div><ul class="ticks small"><li>Create a repo and commit this <code>index.html</code>.</li><li>Repo → Settings → Pages → Deploy from branch → <code>main</code> / <code>(root)</code>.</li><li>Open <code>https://&lt;username&gt;.github.io/&lt;repo&gt;/</code>.</li><li>A public repo means anyone with the link can read the plan. Your progress stays in your browser.</li></ul></section>`;
}

/* =========================================================================
   EVENTS
   ========================================================================= */
function go(tab, extra){ Object.assign(S.ui, {tab}, extra||{}); save(); render(); window.scrollTo({top:0, behavior:"smooth"}); }
document.addEventListener("click", e=>{
  if(e.target.closest("#themeBtn")){
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const nx = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = nx; try{ localStorage.setItem(KEY+".theme", nx); }catch(err){}
    return;
  }
  const t = e.target.closest("[data-tab],[data-act],[data-pr],[data-delfiller],[data-delapp],[data-openweek],[data-opentopic],[data-week],[data-topic],[data-drill],[data-kk],[data-lec],[data-bt],[data-openbt],[data-kdiff],[data-kstat]");
  if(!t) return;
  const ds = t.dataset;
  if(ds.kk){
    const before = level().i, nx = kkStatus(ds.kk)===ds.ks ? "" : ds.ks;
    setKK(ds.kk, nx);
    if(nx==="done"){ const td = kkToday(), g = S.kkGoal||3; if(td===g){ toast(`🎯 Daily goal hit: ${td}/${g}`,"badge"); confetti(); } else toast(`✓ +10 XP · ${td}/${g} today`); }
    else if(nx==="review") toast("↻ Added to review queue"); else if(nx==="later") toast("⏳ Parked for later");
    afterChange(before); return;
  }
  if(ds.lec){
    const before = level().i, nx = S.lec[ds.lec]===ds.ls ? "" : ds.ls;
    if(nx) S.lec[ds.lec] = nx; else delete S.lec[ds.lec];
    if(nx==="done"){ bump(); toast("🎬 +15 XP · Lecture done"); }
    afterChange(before); return;
  }
  if(ds.bt){ S.ui.bt = ds.bt; save(); render(); return; }
  if(ds.openbt) return go("bootcamp", {bt:ds.openbt});
  if(ds.kdiff || ds.kstat){
    const key = ds.kdiff ? "kdiff" : "kstat"; S.ui[key] = ds[key]; save();
    document.querySelectorAll(`[data-${key}]`).forEach(b=>b.classList.toggle("on", b===t)); applyKKFilter(); return;
  }
  if(ds.tab) return go(ds.tab);
  if(ds.openweek) return go("weeks", {week:+ds.openweek});
  if(ds.opentopic) return go("topics", {topic:ds.opentopic});
  if(ds.week){ S.ui.week = Math.max(1, Math.min(12, +ds.week)); save(); render(); return; }
  if(ds.topic){ S.ui.topic = ds.topic; save(); render(); return; }
  if(ds.pr){
    const k = ds.pr, before = level().i, d = +ds.delta;
    S.prompts[k] = Math.max(0, (S.prompts[k]||0) + d);
    if(d > 0){ bump(); toast(`🎙️ +5 XP · Prompt #${k} rep ${S.prompts[k]}`); if(S.prompts[k] === 8) confetti(); }
    afterChange(before); return;
  }
  if(ds.drill){
    if(ds.drill === "toggle"){
      if(T.run){ T.run = false; clearInterval(T.id); }
      else { T.run = true; T.end = Date.now() + T.left*1000; clearInterval(T.id); T.id = setInterval(drillTick, 250); }
    } else if(ds.drill === "skip"){
      if(T.i < DRILL.length-1){ T.i++; T.left = DRILL[T.i][1]*60; T.end = Date.now() + T.left*1000; }
    } else if(ds.drill === "reset"){ T.run = false; clearInterval(T.id); T.i = 0; T.left = DRILL[0][1]*60; }
    paintDrill(); return;
  }
  if(ds.delfiller){ S.fillers = S.fillers.filter(x=>x.id!==ds.delfiller); save(); render(); return; }
  if(ds.delapp){ if(confirm("Remove this company?")){ S.apps = S.apps.filter(x=>x.id!==ds.delapp); save(); render(); } return; }
  const a = ds.act;
  if(a === "saveStart"){ S.start = document.getElementById("startDate").value; S.ui.week = null; save(); toast("📆 Start date saved"); render(); return; }
  if(a === "addFiller"){
    const f = document.getElementById("flF").value; if(f === "") return;
    const before = level().i;
    S.fillers.push({id:Date.now()+"", d:document.getElementById("flDate").value, f, r:document.getElementById("flR").value||"0", p:document.getElementById("flP").value});
    bump(); toast("🎙️ +5 XP · Session logged"); afterChange(before); return;
  }
  if(a === "addApp"){
    const c = document.getElementById("apC").value.trim(); if(!c) return;
    const before = level().i, ref = document.getElementById("apRef").value.trim();
    S.apps.unshift({id:Date.now()+"", c, t:document.getElementById("apT").value, r:document.getElementById("apR").value.trim(), ch:document.getElementById("apCh").value, ref, stage: ref ? "Referral asked" : "Target", d:todayStr(), n:""});
    bump(); toast(`📮 +5 XP · ${esc(c)} added`); afterChange(before); return;
  }
  if(a === "copyRef"){ navigator.clipboard?.writeText(document.getElementById("refMsg").innerText).then(()=>toast("📋 Copied")); return; }
  if(a === "export"){
    const blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
    const u = URL.createObjectURL(blob), l = document.createElement("a");
    l.href = u; l.download = `roadmap-progress-${todayStr()}.json`; l.click(); URL.revokeObjectURL(u); return;
  }
  if(a === "reset"){ if(confirm("Delete ALL progress? Export first if unsure.")){ S = defaultState(); save(); render(); } return; }
});

function afterChange(levelBefore){
  checkBadges(false);
  const L = level();
  if(L.i > levelBefore){ toast(`⬆️ Level up! <b>Lv ${L.i+1} · ${L.name}</b>`,"badge"); confetti(); }
  save(); render();
}

document.addEventListener("change", e=>{
  const t = e.target;
  if(t.dataset.id){
    const before = level().i, it = ALL.find(i=>i.id===t.dataset.id);
    const wasWeek = it ? weekDone(it.w) : false, wasPhase = it ? phaseDone(it.phase) : false;
    if(t.checked) S.done[t.dataset.id] = Date.now(); else delete S.done[t.dataset.id];
    if(it && it.lc && KK_SLUGS.has(it.lc)){ if(t.checked) S.kk[it.lc] = {s:"done", t:Date.now()}; else if(kkStatus(it.lc)==="done") delete S.kk[it.lc]; }
    if(t.checked){
      if(it && !wasWeek && weekDone(it.w)){ toast(`🎉 Week ${it.w} cleared!`,"badge"); confetti(); }
      else if(it && !wasPhase && phaseDone(it.phase)){ toast(`🏁 ${PHASES[it.phase].name} complete!`,"badge"); confetti(); }
      else toast("✓ +10 XP");
    }
    afterChange(before); return;
  }
  if(t.id === "hideDone"){ S.ui.hideDone = t.checked; save(); document.getElementById("main").classList.toggle("hide-done", t.checked); return; }
  if(t.dataset.appstage){
    const a = S.apps.find(x=>x.id===t.dataset.appstage);
    if(a){ const before = level().i; a.stage = t.value; bump(); if(t.value==="Offer"){ toast(`🏆 Offer from ${esc(a.c)}!`,"badge"); confetti(); } afterChange(before); }
    return;
  }
  if(t.id === "importFile" && t.files[0]){
    const r = new FileReader();
    r.onload = () => { try{ const d = JSON.parse(r.result); S = normalize(d); save(); render(); toast("✅ Imported"); }catch(err){ alert("Invalid file."); } };
    r.readAsText(t.files[0]);
  }
});
document.addEventListener("input", e=>{
  const t = e.target;
  if(t.dataset.note){ S.notes[t.dataset.note] = t.value; save(); }
  if(t.id === "kq"){ S.ui.kq = t.value.slice(0,60); save(); applyKKFilter(); }
  if(t.id === "kkGoal"){ const g = Math.floor(+t.value); if(g >= 1 && g <= 20){ S.kkGoal = g; save(); } }
  if(t.dataset.appnote){ const a = S.apps.find(x=>x.id===t.dataset.appnote); if(a){ a.n = t.value; save(); } }
  if(t.dataset.score){ const [w,k] = t.dataset.score.split("."); S.score[w] = S.score[w]||{}; S.score[w][k] = t.value; save(); }
});

document.addEventListener("toggle", e=>{ const d = e.target; if(d && d.dataset && d.dataset.g){ if(d.open) OPEN_GUIDES.add(d.dataset.g); else OPEN_GUIDES.delete(d.dataset.g); } if(d && d.dataset && d.dataset.kt){ S.ui.kopen = S.ui.kopen||{}; S.ui.kopen[d.dataset.kt] = d.open; save(); } }, true);

/* Theme + boot */
(function(){ let th = null; try{ th = localStorage.getItem(KEY+".theme"); }catch(e){} if(th) document.documentElement.dataset.theme = th; })();
checkBadges(true); save();
render();
</script>
</body>
</html>
